name: 📦 Build Old Termux Package
run-name: 📦 ${{ inputs.package_name }} @ ${{ inputs.git_ref }}

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name (e.g., bash, python, nodejs)"
        required: true
        type: string
      git_ref:
        description: "Commit SHA exacto de termux-packages"
        required: true
        type: string
      architecture:
        description: "Target architecture"
        required: false
        default: aarch64
        type: choice
        options:
          - aarch64
          - arm
          - i686
          - x86_64
      format:
        description: "Package format"
        required: false
        default: pacman
        type: choice
        options:
          - pacman
          - debian
      build_mode:
        description: "Dependency resolution mode"
        required: false
        default: fast
        type: choice
        options:
          - fast
          - full
      heavy:
        description: "Optimize for heavy builds: ZRAM 16GB + free disk space"
        required: false
        default: false
        type: boolean

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      package_version: ${{ steps.get_version.outputs.package_version }}
      release_tag: ${{ steps.generate_tag.outputs.release_tag }}

    steps:
      # ── 1. Checkout de termux-packages en el commit exacto ──
      - name: Checkout termux-packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ inputs.git_ref }}
          path: termux-packages

      # Checkout PrevTermuxPackage para acceder a los scripts de parche
      - name: Checkout PrevTermuxPackage
        uses: actions/checkout@v4

      # ── Heavy build: free disk + ZRAM 16GB ──
      - name: Optimize for heavy build
        if: ${{ inputs.heavy }}
        shell: bash
        run: |
          echo "=== Heavy build optimization ==="
          echo ""

          echo "1. Freeing disk space..."
          sudo apt remove -y dotnet-sdk* azure-cli ghc* \
            '^llvm-*' '^google-*' '^mysql-*' '^firefox-*' 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h /
          echo ""

          echo "2. Setting up 16GB ZRAM..."
          sudo swapoff -a 2>/dev/null || true
          sudo modprobe zram 2>/dev/null || true
          echo "16G" | sudo tee /sys/block/zram0/disksize 2>/dev/null || true
          sudo mkswap /dev/zram0 2>/dev/null || true
          sudo swapon -p 5 /dev/zram0 2>/dev/null || true
          echo "Memory after ZRAM:"
          free -h

      # ── 2. Extraer versión del paquete ──
      - name: Extract package version
        id: get_version
        shell: bash
        working-directory: termux-packages
        run: |
          PACKAGE_DIR="packages/${{ inputs.package_name }}"
          BUILD_SH="$PACKAGE_DIR/build.sh"
          if [ ! -f "$BUILD_SH" ]; then
            echo "Error: build.sh not found for package '${{ inputs.package_name }}'"
            echo "Expected path: $BUILD_SH"
            exit 1
          fi

          # Extraer línea cruda de TERMUX_PKG_VERSION
          VERSION_RAW=$(grep -oP '^TERMUX_PKG_VERSION=\K.+' "$BUILD_SH" | head -1)
          if [ -z "$VERSION_RAW" ]; then
            echo "Error: could not extract TERMUX_PKG_VERSION from $BUILD_SH"
            exit 1
          fi

          # Resolver variables ${VAR}, $VAR y ${VAR%.*} usando las definiciones del build.sh
          VERSION="$VERSION_RAW"
          # Quitar comillas
          VERSION=$(echo "$VERSION" | tr -d '"' | tr -d "'")

          # Extraer TODAS las definiciones del build.sh como tabla hash
          declare -A VARS
          while IFS='=' read -r name value; do
            name=$(echo "$name" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            value=$(echo "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [[ -n "$name" && "$name" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]; then
              VARS["$name"]="$value"
            fi
          done < <(grep -oP '^\s*[a-zA-Z_][a-zA-Z0-9_]*=.*' "$BUILD_SH" | head -100)

          # Resolver recursivamente (máximo 20 iteraciones)
          for i in $(seq 1 20); do
            # Buscar ${VAR} con posibles operaciones tipo %.%
            if [[ "$VERSION" =~ \$\{([a-zA-Z_][a-zA-Z0-9_]*)([#%]?[^}]*)?\} ]]; then
              FULL_MATCH="${BASH_REMATCH[0]}"
              VAR_NAME="${BASH_REMATCH[1]}"
              VAR_OP="${BASH_REMATCH[2]:-}"
              VAR_VALUE="${VARS[$VAR_NAME]:-}"

              if [ -z "$VAR_VALUE" ]; then
                echo "Warning: could not resolve variable $VAR_NAME" >&2
                break
              fi

              # Limpiar comillas
              VAR_VALUE=$(echo "$VAR_VALUE" | tr -d '"' | tr -d "'")

              # Si el valor referencia otra variable, resolverla ya
              if [[ "$VAR_VALUE" =~ \$\{([a-zA-Z_][a-zA-Z0-9_]*)([#%]?[^}]*)?\} ]]; then
                INNER_VAR="${BASH_REMATCH[1]}"
                INNER_OP="${BASH_REMATCH[2]:-}"
                INNER_VAL="${VARS[$INNER_VAR]:-}"
                if [ -n "$INNER_VAL" ]; then
                  INNER_VAL=$(echo "$INNER_VAL" | tr -d '"' | tr -d "'")
                  # Aplicar operación interna si existe
                  case "$INNER_OP" in
                    %.*) INNER_VAL="${INNER_VAL%${INNER_OP#%}}" ;;
                    %%.*) INNER_VAL="${INNER_VAL%%${INNER_OP#%%}}" ;;
                  esac
                  VAR_VALUE="${VAR_VALUE//\$\{${INNER_VAR}${INNER_OP}\}/${INNER_VAL}}"
                fi
              fi

              # Aplicar operación externa si existe (%.* es la más común)
              case "$VAR_OP" in
                %.*)  VAR_VALUE="${VAR_VALUE%${VAR_OP#%}}" ;;
                %%.*) VAR_VALUE="${VAR_VALUE%%${VAR_OP#%%}}" ;;
              esac

              VERSION="${VERSION//${FULL_MATCH}/${VAR_VALUE}}"
            elif [[ "$VERSION" =~ \$([a-zA-Z_][a-zA-Z0-9_]*) ]] && [[ "${BASH_REMATCH[0]}" != \$\{* ]]; then
              # Formato $VAR sin llaves
              VAR_NAME="${BASH_REMATCH[1]}"
              VAR_VALUE="${VARS[$VAR_NAME]:-}"
              if [ -z "$VAR_VALUE" ]; then
                break
              fi
              VAR_VALUE=$(echo "$VAR_VALUE" | tr -d '"' | tr -d "'")
              VERSION="${VERSION//\$"${VAR_NAME}"/${VAR_VALUE}}"
            else
              break  # No más variables
            fi
          done

          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${VERSION}"

      # ── 3. Compilar el paquete ──
      - name: Fetch build system from master
        shell: bash
        run: |
          echo "Cloning scripts/ from termux-packages master..."
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/termux/termux-packages.git /tmp/termux-master
          cd /tmp/termux-master
          git sparse-checkout set scripts packages/termux-keyring packages/termux-elf-cleaner
          
          echo "Downloading build-package.sh..."
          curl -sL -o build-package.sh \
            "https://raw.githubusercontent.com/termux/termux-packages/master/build-package.sh"
          chmod +x build-package.sh

          echo "Downloading repo.json..."
          curl -sL -o "${GITHUB_WORKSPACE}/termux-packages/repo.json" \
            "https://raw.githubusercontent.com/termux/termux-packages/master/repo.json" 2>/dev/null || true
          
          echo "Replacing build system files..."
          cp build-package.sh "${GITHUB_WORKSPACE}/termux-packages/build-package.sh"
          rm -rf "${GITHUB_WORKSPACE}/termux-packages/scripts"
          cp -r scripts "${GITHUB_WORKSPACE}/termux-packages/scripts"

          # Copiar claves GPG (termux-keyring)
          rm -rf "${GITHUB_WORKSPACE}/termux-packages/packages/termux-keyring"
          cp -r packages/termux-keyring \
            "${GITHUB_WORKSPACE}/termux-packages/packages/termux-keyring"

          # Copiar build.sh moderno de termux-elf-cleaner
          rm -rf "${GITHUB_WORKSPACE}/termux-packages/packages/termux-elf-cleaner"
          cp -r packages/termux-elf-cleaner \
            "${GITHUB_WORKSPACE}/termux-packages/packages/termux-elf-cleaner"

          # Crear directorios vacíos que el buildorder moderno espera
          mkdir -p "${GITHUB_WORKSPACE}/termux-packages/root-packages"
          mkdir -p "${GITHUB_WORKSPACE}/termux-packages/x11-packages"

          rm -rf /tmp/termux-master
          echo "Done. Build system updated from master."

      # ── 3.5 Aplicar parches de compatibilidad para commits antiguos ──
      - name: Apply build system patches
        shell: bash
        run: |
          chmod +x ./scripts/patch-build-system.sh
          ./scripts/patch-build-system.sh "$PWD/termux-packages"

      - name: Build package
        shell: bash
        working-directory: termux-packages
        env:
          CI: "true"
        run: |
          if [ "${{ inputs.build_mode }}" = "full" ]; then
            echo "Running full build (-F) for ${{ inputs.package_name }}..."
            ./scripts/run-docker.sh ./build-package.sh \
              --format ${{ inputs.format }} \
              -a ${{ inputs.architecture }} \
              -F ${{ inputs.package_name }}
          else
            echo "Running fast build (-I) for ${{ inputs.package_name }}..."
            ./scripts/run-docker.sh ./build-package.sh \
              --format ${{ inputs.format }} \
              -a ${{ inputs.architecture }} \
              -I ${{ inputs.package_name }}
          fi

      # ── 4. Subir artifact (antes de crear release, por si algo falla) ──
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_name }}-${{ steps.get_version.outputs.package_version }}-${{ inputs.architecture }}
          path: |
            termux-packages/output/*.pkg.tar.*
            termux-packages/output/*.deb
          if-no-files-found: error

      # ── 5. Generar tag para el release ──
      - name: Generate release tag
        id: generate_tag
        shell: bash
        run: |
          SHA7="${{ inputs.git_ref }}"
          SHA7="${SHA7:0:7}"
          SAFE_VERSION="${{ steps.get_version.outputs.package_version }}"
          SAFE_VERSION=$(echo "$SAFE_VERSION" | tr -d '"' | tr -d "'" | tr -d ' ')
          TAG="${{ inputs.package_name }}-${SAFE_VERSION}-${SHA7}"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: ${TAG}"

      # ── 6. Crear GitHub Release (solo si no existe ya) ──
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ steps.generate_tag.outputs.release_tag }}"

          # Verificar si el release ya existe
          if gh release view "$TAG" -R "$REPO" &>/dev/null; then
            echo "Release '$TAG' already exists. Skipping creation."
          else
            PACKAGE_VERSION="${{ steps.get_version.outputs.package_version }}"
            printf -v NOTES 'Package: %s\nVersion: %s\nArchitecture: %s\nFormat: %s\nCommit: %s' \
              "${{ inputs.package_name }}" \
              "${PACKAGE_VERSION}" \
              "${{ inputs.architecture }}" \
              "${{ inputs.format }}" \
              "${{ inputs.git_ref }}"

            shopt -s nullglob
            FILES=("${GITHUB_WORKSPACE}/termux-packages/output/"*.pkg.tar.* "${GITHUB_WORKSPACE}/termux-packages/output/"*.deb)

            if [ ${#FILES[@]} -gt 0 ]; then
              echo "Creating release '$TAG' with ${#FILES[@]} artifact(s)..."
              gh release create "$TAG" "${FILES[@]}" \
                -R "$REPO" \
                --notes "$NOTES"
            else
              echo "Warning: No package files found to attach."
              gh release create "$TAG" \
                -R "$REPO" \
                --notes "$NOTES"
            fi
          fi
